{# Usage: {% include 'admin/_ox_tabs.html' with tabs=tabs current=status param="status" q=q cols=4 %}  tabs = [{key,label,count,tint}] #}
<nav class="ox-tabs" style="--cols:{{ cols|default:4 }}" aria-label="Filter">
    {% for t in tabs %}<a href="?{{ param }}={{ t.key }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}{% if extra %}&amp;{{ extra }}{% endif %}" class="ox-tile ox-tab {{ t.tint|default:'t-navy' }}"{% if current == t.key %} aria-current="true"{% endif %}><span>{{ t.label }}</span><b>{{ t.count }}</b></a>{% endfor %}
</nav>
