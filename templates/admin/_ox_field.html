{# Usage: {% include 'admin/_ox_field.html' with field=form.name label="Name" help="Optional help text" %} #}
<div class="ox-field">
    <label for="{{ field.id_for_label }}" class="ox-lab">{{ label|default:field.label }}{% if field.field.required %}<span class="ox-req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if help %}<p class="ox-help">{{ help }}</p>{% endif %}
    {% for e in field.errors %}<p class="ox-err" role="alert"><i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i><span>{{ e }}</span></p>{% endfor %}
</div>
