{# Usage: {% include 'admin/_ox_head.html' with title="Banners" sub="..." label="Live now" value=counts.live back=some_url %} #}
<header class="ox-head">
    <div class="ox-head-in">
        <div class="ox-head-l">
            <a href="{% if back %}{{ back }}{% else %}{% url 'admin_panel' %}{% endif %}" class="ox-back" aria-label="Back"><i class="bi bi-arrow-left" aria-hidden="true"></i></a>
            <div>
                <h1 class="ox-title">{{ title }}</h1>
                {% if sub %}<p class="ox-sub">{{ sub }}</p>{% endif %}
            </div>
        </div>
        {% if label %}
        <div class="ox-bal">
            <div>
                <span class="ox-bal-l">{{ label }}</span>
                <p class="ox-total">{{ value }}</p>
            </div>
            {% if action_url %}<a href="{{ action_url }}" class="ox-btn ox-btn-sm"><i class="bi bi-plus-lg" aria-hidden="true"></i>{{ action_label }}</a>{% endif %}
        </div>
        {% endif %}
    </div>
</header>
