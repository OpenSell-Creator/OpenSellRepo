{% if page_obj.has_other_pages %}
<nav class="ox-pager" aria-label="Pagination">
    {% if page_obj.has_previous %}
    <a class="ox-btn ox-btn-sm ox-btn-neutral" href="?page=1{% if keep %}&amp;{{ keep }}{% endif %}">First</a>
    <a class="ox-btn ox-btn-sm ox-btn-neutral" href="?page={{ page_obj.previous_page_number }}{% if keep %}&amp;{{ keep }}{% endif %}">Previous</a>
    {% endif %}
    <span class="ox-pager-n">{{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a class="ox-btn ox-btn-sm ox-btn-neutral" href="?page={{ page_obj.next_page_number }}{% if keep %}&amp;{{ keep }}{% endif %}">Next</a>
    <a class="ox-btn ox-btn-sm ox-btn-neutral" href="?page={{ page_obj.paginator.num_pages }}{% if keep %}&amp;{{ keep }}{% endif %}">Last</a>
    {% endif %}
</nav>
{% endif %}
