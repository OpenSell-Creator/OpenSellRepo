/* ===== OpenSell admin core (shared). Include inside <style>. Same tokens and patterns as admin_panel.html ===== */
/* Highlight colour for hover, selection and links: navy in light mode, orange in dark mode (no blue) */
:root, [data-bs-theme="light"] { --hl: var(--primary-color); --hl-edge: var(--primary-color); --hl-soft: var(--primary-soft); }
[data-bs-theme="dark"] { --hl: var(--accent-text); --hl-edge: var(--accent-color); --hl-soft: var(--accent-soft); }
/* Buttons: same pill as login, profile and the wallet pages. Hover fills with the brand orange. */
.ox-btn { box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: var(--sp-2); width: 100%; min-height: var(--h-control-lg); margin: 0; padding: 0 var(--sp-4); border: 2px solid var(--bs-white); border-radius: var(--radius-full); background: var(--primary-color); color: var(--bs-white); font: inherit; font-size: var(--font-size-base); font-weight: 600; line-height: var(--lh-tight); text-align: center; text-decoration: none; box-shadow: 0 4px 12px rgba(0, 0, 0, .2); cursor: pointer; touch-action: manipulation; }
.ox-btn:disabled { opacity: .7; cursor: default; }
.ox-btn .spinner-border { width: 1rem; height: 1rem; border-width: .15em; }
.ox-btn-sm { min-height: 2.5rem; width: auto; padding: 0 var(--sp-4); font-size: var(--font-size-sm); }
.ox-btn.ox-btn-neutral { border: 1px solid var(--border-color); background: var(--card-background); color: var(--text-primary); box-shadow: none; }
.ox-btn.ox-btn-light { border-color: var(--bs-white); background: var(--bs-white); color: var(--primary-color); box-shadow: none; }
.ox-btn.ox-btn-ghost { border-color: var(--bs-white); background: transparent; color: var(--bs-white); box-shadow: none; }
.ox-btn.ox-danger { border: 1px solid var(--ox-red); background: var(--card-background); color: var(--error-text); box-shadow: none; }
.ox-btn:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }
@media (hover: hover) {
    .ox-btn.ox-btn:not(:disabled):hover { background: var(--accent-color); color: var(--on-accent); }
    .ox-btn.ox-btn-neutral:not(:disabled):hover { background: var(--hover-bg); color: var(--text-primary); border-color: var(--hl-edge); }
    .ox-btn.ox-danger:not(:disabled):hover { background: var(--ox-red); color: var(--bs-white); border-color: var(--ox-red); }
}
/* Shared core */
.ox {
    --ox-navy: var(--primary-color);
    --ox-orange: var(--accent-color);
    --ox-green: var(--bs-success, var(--primary-color));
    --ox-red: var(--bs-danger, var(--accent-color));
    --ox-purple: var(--bs-purple, var(--primary-color));
    --ox-w: 72rem;
    --pos: #1e7e34;
    color: var(--text-primary);
    font-size: var(--font-size-base);
    line-height: var(--lh-body);
    padding-bottom: calc(var(--bottom-nav-height) + var(--sp-4));
}
[data-bs-theme="dark"] .ox { --pos: #4cc16a; }
.ox a { text-decoration: none; }
.ox p { margin: 0; }
.ox [hidden] { display: none !important; }
.t-navy { --tint: var(--ox-navy); } .t-orange { --tint: var(--ox-orange); } .t-green { --tint: var(--ox-green); } .t-red { --tint: var(--ox-red); } .t-purple { --tint: var(--ox-purple); }
.ox-ico { display: grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; border-radius: var(--radius-full); background: var(--tint); color: var(--bs-white); font-size: var(--font-size-lg); }
.t-orange .ox-ico, .t-orange.ox-ico { color: var(--on-accent); }
.ox-wash { position: relative; isolation: isolate; }
.ox-wash::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--tint); opacity: .14; }
[data-bs-theme="dark"] .ox-wash::before { opacity: .09; }
.ox a:focus-visible, .ox button:focus-visible, .ox summary:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }

/* Header */
.ox-head { margin: -2rem -1rem var(--gap-sections); padding: calc(2rem + var(--sp-4)) var(--sp-4) var(--sp-5); border-radius: 0 0 var(--radius-xl) var(--radius-xl); background: var(--primary-color); color: var(--bs-white); }
.ox-head-in { display: grid; gap: var(--sp-4); max-width: var(--ox-w); margin: 0 auto; }
.ox-head-l { display: flex; align-items: center; gap: var(--sp-2); }
.ox-back { display: grid; place-items: center; flex: none; width: 2.75rem; height: 2.75rem; margin-left: calc(var(--sp-2) * -1); border-radius: var(--radius-full); color: var(--bs-white); font-size: var(--font-size-xl); }
.ox-title { margin: 0; font-size: var(--font-size-xl); font-weight: 600; line-height: var(--lh-tight); }
.ox-sub { margin: var(--sp-1) 0 0; font-size: var(--font-size-sm); color: rgba(255, 255, 255, .85); }
.ox-bal { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--pad-l); border-radius: var(--radius-lg); background: var(--card-background); color: var(--text-primary); }
.ox-bal .ox-btn { width: auto; }
.ox-bal-l { font-size: var(--font-size-sm); color: var(--text-secondary); }
.ox-total { margin: 0; font-size: var(--font-size-3xl); font-weight: 600; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.ox-link { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1); min-height: 2.75rem; padding: 0 var(--sp-2); color: var(--hl); font-size: var(--font-size-sm); font-weight: 600; }
@media (hover: hover) { .ox-link:hover { text-decoration: underline; } }

/* Layout and cards */
.ox-main { display: flex; flex-direction: column; gap: var(--gap-sections); max-width: var(--ox-w); margin: 0 auto; }
.ox-card { padding: var(--pad-m); border: 1px solid var(--border-color); border-radius: var(--r-card); background: var(--card-background); }
@media (min-width: 768px) { .ox-card { padding: var(--pad-l); } }
.ox-sec-h { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.ox-sec-t { flex: 1 1 auto; min-width: 0; }
.ox-h2 { margin: 0; font-size: var(--font-size-lg); font-weight: 600; line-height: var(--lh-tight); }
.ox-card-sub { margin: var(--sp-1) 0 0; font-size: var(--font-size-sm); line-height: var(--lh-snug); color: var(--text-secondary); }
.ox-pill { display: inline-flex; align-items: center; gap: var(--sp-1); padding: 0 var(--sp-2); border: 1px solid var(--tint); border-radius: var(--radius-full); font-size: var(--font-size-xs); font-weight: 600; line-height: var(--lh-body); white-space: nowrap; }
.ox-alert { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); font-size: var(--font-size-sm); line-height: var(--lh-snug); --tint: var(--ox-red); }
.ox-alert i { margin-top: 1px; color: var(--error-text); }
.ox-alert.t-orange { --tint: var(--ox-orange); } .ox-alert.t-orange i { color: var(--accent-text); }
.ox-alert.t-navy { --tint: var(--ox-navy); } .ox-alert.t-navy i { color: var(--hl); }
.ox-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-cards); }
.ox-tile { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; padding: var(--pad-m); border: 1px solid var(--border-color); border-radius: var(--r-card-s); background: var(--card-background); line-height: var(--lh-tight); }
.ox-tile .ox-ico { width: 2rem; height: 2rem; margin-bottom: var(--sp-1); color: var(--bs-white); font-size: var(--font-size-lg); }
.ox-tile .t-orange.ox-ico { color: var(--on-accent); }
.ox-tile b { font-size: var(--font-size-xl); font-weight: 600; overflow-wrap: anywhere; }
.ox-tile span { font-size: var(--font-size-sm); color: var(--text-secondary); }
.ox-tile small { font-size: var(--font-size-xs); color: var(--text-secondary); }
.ox-dl { margin: 0; border: 1px solid var(--border-color); border-radius: var(--r-card-s); }
.ox-dl div { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3); border-top: 1px solid var(--border-color); }
.ox-dl div:first-child { border-top: 0; }
.ox-dl dt { font-size: var(--font-size-sm); font-weight: 400; color: var(--text-secondary); }
.ox-dl dd { margin: 0; font-size: var(--font-size-base); font-weight: 600; text-align: right; overflow-wrap: anywhere; }
@media (hover: hover) { a.ox-tile:hover, a.ox-row:hover { border-color: var(--hl-edge); } }
.ox-row { display: flex; align-items: center; gap: var(--sp-3); min-height: 2.75rem; padding: var(--pad-s) var(--pad-m); border: 1px solid var(--border-color); border-radius: var(--r-card-s); background: var(--card-background); color: var(--text-primary); font-size: var(--font-size-base); font-weight: 600; }
.ox-row .ox-ico { width: 2rem; height: 2rem; }
.ox-row .bi-chevron-right { margin-left: auto; color: var(--text-secondary); }
@media (min-width: 768px) { .ox-head-in { gap: var(--sp-5); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

/* Status pills: one tint per state. The icon and the label carry the meaning, not the colour alone. */
.st { --tint: var(--text-secondary); }
.st-pending, .st-scheduled, .st-expiring, .st-mid { --tint: var(--ox-orange); }
.st-under_review, .st-approved, .st-processing { --tint: var(--hl-edge); }
.st-completed, .st-active, .st-live, .st-verified, .st-high { --tint: var(--ox-green); }
.st-rejected, .st-failed, .st-expired, .st-suspended, .st-low { --tint: var(--ox-red); }
.st-inactive { --tint: var(--text-secondary); }

/* Filter tiles (use style="--cols:N") */
.ox-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-cards); }
@media (min-width: 768px) { .ox-tabs { grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); } }
.ox-tab { color: var(--text-primary); }
.ox-tab b { font-size: var(--font-size-2xl); font-variant-numeric: tabular-nums; }
.ox-tab[aria-current="true"] { border-color: var(--hl-edge); background: var(--hl-soft); box-shadow: inset 0 0 0 1px var(--hl-edge); }
@media (hover: hover) { .ox-tab:hover { border-color: var(--hl-edge); } }
.ox-tab:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }

/* Toolbar and controls */
.ox-bar { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--gap-fields); }
.ox-bar .ox-ctl { flex: 1 1 9rem; width: auto; }
.ox-bar .ox-grow { flex: 3 1 14rem; }
.ox-bar .ox-btn { width: auto; min-width: 3rem; }
.ox-ctl { box-sizing: border-box; width: 100%; min-height: var(--h-control-lg); padding: 0 var(--sp-3); border: 1px solid var(--border-color); border-radius: var(--radius-md); background-color: var(--background-color); color: var(--text-primary); font: inherit; font-size: var(--font-size-base); }
select.ox-ctl { padding-right: 2rem; }
textarea.ox-ctl { min-height: 5.5rem; padding: var(--sp-2) var(--sp-3); line-height: var(--lh-body); resize: vertical; }
.ox-ctl::placeholder { color: var(--text-secondary); opacity: 1; }
.ox-ctl:focus { outline: 2px solid var(--accent-color); outline-offset: 1px; border-color: var(--accent-color); box-shadow: none; background-color: var(--background-color); color: var(--text-primary); }
.ox-ctl::file-selector-button { margin: 0 var(--sp-3) 0 0; padding: var(--sp-1) var(--sp-3); border: 1px solid var(--border-color); border-radius: var(--radius-full); background: var(--card-background); color: var(--text-primary); font: inherit; font-size: var(--font-size-sm); font-weight: 600; cursor: pointer; }
input[type="file"].ox-ctl { padding: var(--sp-2) var(--sp-3); height: auto; }
[data-bs-theme="dark"] .ox-ctl { color-scheme: dark; }
@supports (-webkit-touch-callout: none) { .ox-ctl { font-size: 16px; } }

/* List rows */
.ox-list { display: flex; flex-direction: column; gap: var(--gap-cards); margin: 0; padding: 0; list-style: none; }
.ox-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who pill" "nums nums" "acts acts"; align-items: center; gap: var(--sp-3) var(--sp-2); padding: var(--pad-m); border: 1px solid var(--border-color); border-radius: var(--r-card-s); background: var(--card-background); }
.ox-item.is-flag { border-color: var(--ox-orange); }
.ox-item.is-bad { border-color: var(--ox-red); }
.ox-item.has-body { grid-template-areas: "who pill" "body body" "nums nums" "acts acts"; }
.ox-who { grid-area: who; display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.ox-av { display: grid; place-items: center; flex: none; width: 2.5rem; height: 2.5rem; border-radius: var(--radius-full); background: var(--primary-soft); color: var(--hl); font-weight: 600; text-transform: uppercase; }
.ox-thumb { flex: none; width: 3.5rem; height: 3.5rem; border-radius: var(--radius-md); object-fit: cover; background: var(--hover-bg); }
.ox-who-t { min-width: 0; line-height: var(--lh-snug); }
.ox-who-t b { display: block; font-size: var(--font-size-base); font-weight: 600; overflow-wrap: anywhere; }
.ox-who-t span, .ox-who-t a { display: block; font-size: var(--font-size-sm); color: var(--text-secondary); overflow-wrap: anywhere; }
.ox-who-t a { color: var(--hl); }
.ox-item > .ox-pill { grid-area: pill; }
.ox-body { grid-area: body; min-width: 0; }
.ox-quote { padding: var(--pad-s) var(--pad-m); border-left: 3px solid var(--hl-edge); border-radius: var(--radius-md); background: var(--hl-soft); overflow-wrap: anywhere; }
.ox-reply { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-2); margin-left: var(--sp-4); padding: var(--pad-s) var(--pad-m); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: var(--font-size-sm); }
.ox-reply > div { min-width: 0; overflow-wrap: anywhere; }
.ox-reply small { display: block; color: var(--text-secondary); font-size: var(--font-size-xs); }
.ox-nums { grid-area: nums; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2) var(--sp-3); margin: 0; padding-top: var(--sp-3); border-top: 1px solid var(--border-color); }
.ox-nums dt { font-size: var(--font-size-xs); font-weight: 400; color: var(--text-secondary); }
.ox-nums dd { margin: 0; font-size: var(--font-size-base); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ox-nums dd small { display: block; font-size: var(--font-size-xs); font-weight: 400; color: var(--text-secondary); }
.ox-acts { grid-area: acts; display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.ox-acts form { display: contents; }
.ox-acts .ox-btn { flex: 1 1 7rem; }
@media (min-width: 992px) {
    .ox-item { grid-template-columns: minmax(0, 1.5fr) auto minmax(0, 3.2fr) auto; grid-template-areas: "who pill nums acts"; gap: var(--sp-4); }
    .ox-item.has-body { grid-template-areas: "who pill nums acts" "body body body body"; }
    .ox-nums { grid-template-columns: repeat(var(--ncols, 4), minmax(0, 1fr)); padding-top: 0; border-top: 0; }
    .ox-acts { flex-wrap: nowrap; justify-content: flex-end; }
    .ox-acts .ox-btn { flex: none; }
}

/* Pager and empty state */
.ox-pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-2); margin-top: var(--gap-fields); }
.ox-pager .ox-btn { width: auto; }
.ox-pager-n { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-secondary); }
.ox-empty { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); padding: var(--sp-6, 2rem) var(--sp-2); text-align: center; }
.ox-empty .ox-ico { width: 3rem; height: 3rem; font-size: var(--font-size-3xl); }
.ox-empty h2 { margin: 0 0 var(--sp-1); font-size: var(--font-size-lg); font-weight: 600; }
.ox-empty p { max-width: 22rem; font-size: var(--font-size-base); color: var(--text-secondary); }

/* Form layout (same two-column shape as the review pages) */
.ox-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-sections, var(--sp-4)); }
.ox-col { display: flex; flex-direction: column; gap: var(--gap-cards); min-width: 0; }
@media (min-width: 992px) {
    .ox-layout { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
    .ox-sticky { position: sticky; top: calc(var(--navbar-height, 4rem) + var(--sp-3)); }
}
.ox-fgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-fields); }
@media (min-width: 768px) { .ox-fgrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ox-field { min-width: 0; }
.ox-lab { display: block; margin-bottom: var(--sp-1); font-size: var(--font-size-sm); font-weight: 600; }
.ox-req { margin-left: var(--sp-1); color: var(--error-text); }
.ox-help { margin-top: var(--sp-1); font-size: var(--font-size-xs); line-height: var(--lh-snug); color: var(--text-secondary); }
.ox-err { display: flex; align-items: flex-start; gap: var(--sp-1); margin-top: var(--sp-1); font-size: var(--font-size-sm); color: var(--error-text); }
.ox-err i { margin-top: 2px; }
.ox-switch { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--background-color); cursor: pointer; }
.ox-switch input { flex: none; width: 1.25rem; height: 1.25rem; margin-top: .1rem; accent-color: var(--accent-color); }
.ox-switch b { display: block; font-size: var(--font-size-base); font-weight: 600; }
.ox-switch span { display: block; font-size: var(--font-size-sm); color: var(--text-secondary); }
.ox-opts { display: grid; gap: var(--sp-1); max-height: 16rem; overflow: auto; padding: var(--sp-2); border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--background-color); }
.ox-opt { display: flex; align-items: center; gap: var(--sp-2); min-height: 2.5rem; padding: 0 var(--sp-2); border-radius: var(--radius-md); cursor: pointer; }
.ox-opt input { flex: none; width: 1.125rem; height: 1.125rem; accent-color: var(--accent-color); }
@media (hover: hover) { .ox-opt:hover { background: var(--hover-bg); } }
.ox-frame { display: grid; place-items: center; overflow: hidden; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--hover-bg); }
.ox-frame img { display: block; max-width: 100%; height: 100%; object-fit: contain; }
.ox-state-list { display: grid; gap: var(--sp-2); }

/* Confirm modal (inside .ox so it carries the same hues) */
.ox .modal-content { --bs-modal-bg: var(--card-background); --bs-modal-color: var(--text-primary); --bs-modal-border-color: var(--border-color); --bs-modal-border-radius: var(--r-card); --bs-modal-inner-border-radius: var(--r-card); background: var(--card-background); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--r-card); }
.ox .modal-dialog { max-width: 26rem; margin-right: var(--sp-4); margin-left: var(--sp-4); }
@media (min-width: 468px) { .ox .modal-dialog { margin-right: auto; margin-left: auto; } }
.ox .modal-header { display: flex; align-items: center; gap: var(--sp-3); padding: var(--pad-l) var(--pad-l) 0; border: 0; }
.ox .modal-title { flex: 1 1 auto; margin: 0; font-size: var(--font-size-lg); font-weight: 600; }
.ox .modal-body { display: grid; gap: var(--gap-fields); padding: var(--pad-m) var(--pad-l) var(--pad-l); }
[data-bs-theme="dark"] .ox .btn-close { filter: invert(1) grayscale(1) brightness(1.6); }
.ox-mf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
form[aria-busy="true"] button[type="submit"] { opacity: .7; cursor: progress; }

/* Section nav for the Home admin pages */
.ox-nav { display: flex; gap: var(--sp-2); overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.ox-nav::-webkit-scrollbar { display: none; }
.ox-nav .ox-btn { flex: none; }
.ox-nav .ox-btn[aria-current="page"] { border-color: var(--hl-edge); background: var(--hl-soft); box-shadow: inset 0 0 0 1px var(--hl-edge); }
.ox-ico-img { flex: none; width: 3.5rem; height: 3.5rem; border-radius: var(--radius-md); object-fit: cover; background: var(--hover-bg); }
.ox-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
