{% if active_boost %}
<style>
.boost-status { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); font-size: var(--font-size-sm); line-height: var(--lh-snug); color: var(--text-secondary); }
.boost-status .bs-pill { display: inline-flex; align-items: center; gap: var(--sp-1); padding: 0 var(--sp-2); border: 1px solid var(--accent-color); border-radius: var(--radius-full); background: var(--accent-soft); color: var(--text-primary); font-size: var(--font-size-xs); font-weight: 600; line-height: var(--lh-body); white-space: nowrap; }
.boost-status .bs-pill i { color: var(--accent-text); }
</style>
<div class="boost-status">
    <span class="bs-pill"><i class="bi bi-rocket-takeoff" aria-hidden="true"></i>{{ active_boost.get_boost_type_display }}</span>
    <span>Expires <time datetime="{{ active_boost.end_date|date:'Y-m-d' }}">{{ active_boost.end_date|date:"M d, Y" }}</time></span>
</div>
{% endif %}
